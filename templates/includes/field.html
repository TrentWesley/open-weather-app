{# One labelled form control with help text and linked errors (NFR-AC-5, NFR-USE-3). #}
<div class="field{% if field.errors %} field-invalid{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}
    <div class="field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>
  {% endif %}
  {% if field.errors %}
    <ul class="field-errors" id="{{ field.auto_id }}_error">
      {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
    </ul>
  {% endif %}
</div>
